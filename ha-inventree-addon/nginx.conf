user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    # Only the Supervisor may supply an Ingress prefix or forwarded scheme.
    # Direct clients use the same listener, with all Ingress headers discarded.
    map $remote_addr $ha_ingress_path {
        default "";
        172.30.32.2 $http_x_ingress_path;
    }
    map "$remote_addr:$http_x_forwarded_proto" $ha_ingress_proto {
        default $scheme;
        "172.30.32.2:https" https;
    }
    server {
        listen 8086;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_set_header X-HA-Ingress-Path $ha_ingress_path;
        proxy_set_header X-HA-Ingress-Proto $ha_ingress_proto;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Never trust client-supplied proxy headers on the exposed port.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        location /static/ {
            alias /data/ha-inventree-addon/static/;
        }
        location /media/ {
            auth_request /_media_auth;
            alias /data/ha-inventree-addon/media/;
            add_header Content-Disposition attachment always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /_media_auth {
            internal;
            proxy_pass http://127.0.0.1:8000/auth/;
            proxy_pass_request_body off;
            proxy_set_header X-HA-Ingress-Path $ha_ingress_path;
            proxy_set_header X-HA-Ingress-Proto $ha_ingress_proto;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-URI $request_uri;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
