name: InvenTree
version: 1.6.4-7
slug: inventree
description: Open-source inventory management using the official InvenTree image
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
timeout: 120
ports:
  8086/tcp: 8086
ports_description:
  8086/tcp: InvenTree web interface
ingress: true
ingress_port: 8086
ingress_entry: web/
panel_title: InvenTree
panel_icon: mdi:package-variant
panel_admin: true
backup: cold
options:
  admin_user: admin
  admin_email: admin@example.com
  admin_password: password
  timezone: Europe/Vienna
  database_engine: sqlite3
  database_host: ""
  database_port: 5432
  database_name: inventree
  database_user: inventree
  database_password: ""
schema:
  admin_user: str
  admin_email: str
  admin_password: password
  timezone: str
  database_engine: list(sqlite3|postgresql)
  database_host: str?
  database_port: port
  database_name: str
  database_user: str
  database_password: password?
